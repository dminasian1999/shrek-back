spring.application.name=shrek-back
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/sevan_local?replicaSet=rs0}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.error.include-message=never
server.error.include-stacktrace=never

spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

aws.s3.access.key=${ACCESS_KEY:}
aws.s3.secret.key=${SECRET_KEY:}
aws.s3.bucketName=${BUCKET_NAME:}

paypal.mode=${PAYPAL_MODE:sandbox}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}

israelpost.username=${ISRAELPOST_USER:}
israelpost.password=${ISRAELPOST_PASS:}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://shrek-front.vercel.app,https://gejekoushiangifts.vercel.app}
checkout.payments-enabled=${CHECKOUT_PAYMENTS_ENABLED:false}
checkout.currency=${CHECKOUT_CURRENCY:USD}
checkout.shipping-exchange-rate=${CHECKOUT_SHIPPING_EXCHANGE_RATE:0}
